<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D.A.R.T – Decentralized Authentication and Record Tracking</title>
    <meta name="description" content="Check whether a document matches its registered version. DART compares digital fingerprints with records on Tezos and gives you a clear Match or Mismatch result." />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('dart_theme');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}

        try {
          var isReload = false;
          var entries = performance.getEntriesByType('navigation');
          if (entries && entries.length > 0) {
            isReload = entries[0].type === 'reload';
          } else if (performance.navigation) {
            isReload = performance.navigation.type === 1;
          }
          if (isReload) {
            if ('scrollRestoration' in history) {
              history.scrollRestoration = 'manual';
            }
            window.scrollTo(0, 0);
          }
        } catch (e) {}
      })();
      window.global = window;
      window.process = window.process || { env: {}, browser: true, version: '' };
    </script>
    <!-- Typography: Host Grotesk and Instrument Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
